server.error.include-message=always
server.error.include-binding-errors=always

# Require datasource and initial AppUser bootstrap settings from the environment when profile `dev`
# is active (e.g. Elastic Beanstalk). Set SPRING_DATASOURCE_* and APP_ADMIN_* on the host/EB —
# do not commit secrets. Bootstrap creates the user only if that username is missing (BCrypt).
spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.format_sql=true
app.admin.username=${APP_ADMIN_USERNAME}
app.admin.password=${APP_ADMIN_PASSWORD}
