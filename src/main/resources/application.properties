server.error.include-message=always
server.error.include-binding-errors=always

# Deterministic OpenAPI document for committed api/openapi.json + frontend codegen
springdoc.api-docs.path=/v3/api-docs
springdoc.writer-with-order-by-keys=true
springdoc.writer-with-default-pretty-printer=true

# Local/CI HTTP Basic user (Spring Boot in-memory). Profile `dev` (EB) requires SECURITY_USER_* with no defaults.
# Override locally via SECURITY_USER_NAME / SECURITY_USER_PASSWORD.
spring.security.user.name=${SECURITY_USER_NAME:dev}
spring.security.user.password=${SECURITY_USER_PASSWORD:changeme}

spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/cariocaphil}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:postgres}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:password}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.format_sql=true
